name: Update stock data

on:
  schedule:
    # Weekdays at 22:30 UTC (19:30 BRT), after the B3 close.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build:data

      - name: Commit data/stocks.json
        run: |
          if git diff --quiet -- data/stocks.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git commit -m "chore: update stock data [skip ci]"
          git push
